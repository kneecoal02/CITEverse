<html>
    <head>
        <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITEverse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="static/landing.css" rel="stylesheet">
    </head>
    <body>
  <div class="container mt-4">
  <div class="row justify-content-center">
    {% for i in sites %}
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4 d-flex">
      <div class="card w-100">
        <!-- 🖼 Site image -->
        {% if i['image'] %}
          <img src="{{ i['image'] }}" class="card-img-top" alt="{{ i['site_name'] }}">
        {% else %}
          <img src="static/images/default_site.png" class="card-img-top" alt="Default Image">
        {% endif %}

        <div class="card-body">
          <h5 class="card-title">{{ i['site_name'] }}</h5>
          <p class="card-text">
            {{ i['description'] }}
          </p>
          <a href="{{ i['site_link'] }}" target="_blank" class="btn btn-primary">Visit Site</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
